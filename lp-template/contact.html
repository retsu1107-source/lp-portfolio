<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="【編集】お問い合わせページの説明文。" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: "#2563eb", dark: "#1d4ed8", light: "#dbeafe" } },
        fontFamily: { sans: ['"Noto Sans JP"', "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="text-gray-800 antialiased">

<header id="site-header" class="fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur transition-shadow">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="text-lg font-bold text-brand">【編集】サービス名</a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
      <a href="index.html#features" class="hover:text-brand">特徴</a>
      <a href="index.html#pricing" class="hover:text-brand">料金</a>
      <a href="index.html#faq" class="hover:text-brand">よくある質問</a>
      <a href="contact.html" class="hover:text-brand">お問い合わせ</a>
    </nav>
    <button id="menu-btn" aria-label="メニューを開く" aria-expanded="false" class="md:hidden p-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden border-t bg-white px-4 py-4 space-y-3 text-sm font-medium">
    <a href="index.html#features" class="block">特徴</a>
    <a href="index.html#pricing" class="block">料金</a>
    <a href="index.html#faq" class="block">よくある質問</a>
    <a href="contact.html" class="block">お問い合わせ</a>
  </div>
</header>

<main class="pt-16">
  <section class="max-w-xl mx-auto px-4 sm:px-6 py-20">
    <p class="text-brand font-bold mb-2 text-center">CONTACT</p>
    <h1 class="text-2xl md:text-4xl font-black mb-4 text-center">お問い合わせ</h1>
    <p class="text-sm text-gray-500 text-center mb-12">【編集】通常1〜2営業日以内にご返信します、等の一言</p>

    <!--
      ▼送信先について（無料で使える代表的な方法）
      1. Formspree（https://formspree.io）: action を https://formspree.io/f/xxxxxxx に変更するだけでOK。無料枠あり。
      2. Googleフォーム: 埋め込み or リンクに差し替え。
      3. サーバーがあるなら独自のAPIエンドポイントに action を向ける。
      現状は仮のactionなので、案件ごとに必ず差し替えること。
    -->
    <form id="contact-form" action="https://formspree.io/f/【編集】xxxxxxx" method="POST" class="space-y-6" novalidate>
      <!-- スパム対策のハニーポット（人間には見えない） -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off" />

      <div>
        <label for="name" class="block text-sm font-bold mb-2">お名前 <span class="text-red-500">*</span></label>
        <input type="text" id="name" name="name" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
        <p id="name-error" class="hidden text-xs text-red-500 mt-1"></p>
      </div>

      <div>
        <label for="email" class="block text-sm font-bold mb-2">メールアドレス <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
        <p id="email-error" class="hidden text-xs text-red-500 mt-1"></p>
      </div>

      <div>
        <label for="company" class="block text-sm font-bold mb-2">会社名・屋号</label>
        <input type="text" id="company" name="company"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
      </div>

      <div>
        <label for="message" class="block text-sm font-bold mb-2">お問い合わせ内容 <span class="text-red-500">*</span></label>
        <textarea id="message" name="message" rows="5" required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand"></textarea>
        <p id="message-error" class="hidden text-xs text-red-500 mt-1"></p>
      </div>

      <button type="submit"
        class="w-full bg-brand text-white rounded-full py-4 font-bold hover:bg-brand-dark transition">
        送信する
      </button>
    </form>
  </section>
</main>

    </nav>
    <p class="text-xs">&copy; <span id="year"></span> 【編集】会社名 All Rights Reserved.</p>
  </div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
