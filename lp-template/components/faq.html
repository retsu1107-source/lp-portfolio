<!-- faq.html：JS不要（details/summaryのネイティブ機能）。style.cssの .faq-icon で矢印回転 -->
<section id="faq" class="bg-gray-50 py-20">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">
    <div class="text-center mb-14">
      <p class="text-brand font-bold mb-2">FAQ</p>
      <h2 class="text-2xl md:text-3xl font-black">よくある質問</h2>
    </div>
    <div class="space-y-4">
      <details class="bg-white rounded-xl p-5 group">
        <summary class="flex justify-between items-center cursor-pointer font-bold list-none">
          【編集】質問1
          <svg class="faq-icon w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </summary>
        <p class="text-sm text-gray-600 mt-3 leading-relaxed">【編集】回答をここに。</p>
      </details>
      <!-- 【編集】↑ このdetailsブロックをコピーして質問を増やす -->
    </div>
  </div>
</section>
