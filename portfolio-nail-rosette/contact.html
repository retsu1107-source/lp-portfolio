<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ご予約｜Nail Salon Rosette</title>
<meta name="description" content="Nail Salon Rosetteへのご予約・お問い合わせはこちらから。" />
<link rel="canonical" href="https://example.com/contact.html" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Kiwi+Maru:wght@500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: "#ec6a9c", dark: "#d14f80", light: "#ffe1ec" } },
        fontFamily: { sans: ['"Noto Sans JP"', "sans-serif"], cute: ['"Kiwi Maru"', "serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="text-stone-800 antialiased">

<header id="site-header" class="fixed top-0 inset-x-0 z-50 bg-[#fff8fa]/90 backdrop-blur transition-shadow">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="font-cute text-lg font-bold text-brand-dark">Nail Salon <span class="text-brand">Rosette</span></a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
      <a href="index.html#features" class="hover:text-brand">こだわり</a>
      <a href="index.html#menu" class="hover:text-brand">メニュー</a>
      <a href="index.html#gallery" class="hover:text-brand">ギャラリー</a>
      <a href="index.html#access" class="hover:text-brand">アクセス</a>
    </nav>
    <button id="menu-btn" aria-label="メニューを開く" aria-expanded="false" class="md:hidden p-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden border-t border-brand-light bg-[#fff8fa] px-4 py-4 space-y-3 text-sm font-medium">
    <a href="index.html#features" class="block">こだわり</a>
    <a href="index.html#menu" class="block">メニュー</a>
    <a href="index.html#gallery" class="block">ギャラリー</a>
    <a href="index.html#access" class="block">アクセス</a>
  </div>
</header>

<main class="pt-16">
  <section class="max-w-xl mx-auto px-4 sm:px-6 py-20">
    <p class="text-brand font-bold mb-2 text-center tracking-wide">CONTACT</p>
    <h1 class="font-cute text-2xl md:text-4xl font-bold mb-4 text-center text-brand-dark">ご予約</h1>
    <p class="text-sm text-stone-500 text-center mb-12">完全予約制のため、ご来店前に下記フォームよりご連絡ください。<br />通常1〜2営業日以内にご返信します。</p>

    <!--
      送信先について：
      1. Formspree（https://formspree.io）: action を https://formspree.io/f/xxxxxxx に変更するだけでOK。
      2. 予約管理アプリ（Beautyアプリ等）を使う場合は、ここをそのアプリの予約ページへのリンクボタンに差し替えてもよい。
    -->
    <form id="contact-form" action="https://formspree.io/f/【編集】xxxxxxx" method="POST" class="space-y-6" novalidate>
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off" />

      <div>
        <label for="name" class="block text-sm font-bold mb-2">お名前 <span class="text-red-500">*</span></label>
        <input type="text" id="name" name="name" required
          class="w-full border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
        <p id="name-error" class="hidden text-xs text-red-500 mt-1"></p>
      </div>

      <div>
        <label for="email" class="block text-sm font-bold mb-2">メールアドレス <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" required
          class="w-full border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
        <p id="email-error" class="hidden text-xs text-red-500 mt-1"></p>
      </div>

      <div>
        <label for="menu" class="block text-sm font-bold mb-2">ご希望メニュー</label>
        <select id="menu" name="menu"
          class="w-full border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand bg-white">
          <option>ジェルネイル（ワンカラー）</option>
          <option>アートネイル</option>
          <option>フットジェル</option>
          <option>ケアメニューのみ</option>
          <option>その他・相談したい</option>
        </select>
      </div>

      <div>
        <label for="date" class="block text-sm font-bold mb-2">ご希望日時</label>
        <input type="text" id="date" name="date" placeholder="例）8月20日（木）14:00頃"
          class="w-full border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
      </div>

      <div>
        <label for="message" class="block text-sm font-bold mb-2">ご要望・ご質問など</label>
        <textarea id="message" name="message" rows="4"
          class="w-full border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand"></textarea>
      </div>

      <button type="submit" class="w-full bg-brand text-white rounded-full py-4 font-bold hover:bg-brand-dark transition">
        予約を送信する
      </button>
    </form>
  </section>
</main>

<footer class="bg-brand-dark text-white/70 py-12">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row justify-between items-center gap-6">
    <p class="font-cute font-bold text-white">Nail Salon Rosette</p>
    <nav class="flex gap-6 text-sm">
      <a href="index.html" class="hover:text-white">ホーム</a>
      <a href="about.html" class="hover:text-white">サロンについて</a>
      <a href="contact.html" class="hover:text-white">ご予約</a>
    </nav>
    <p class="text-xs">&copy; <span id="year"></span> Nail Salon Rosette</p>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
